defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EVOWORLD_RLINF}/examples/sft/config
    - file://${oc.env:EVOWORLD_RLINF}/examples/embodiment/config
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
runner:
  task_type: sft
  logger:
    log_path: ${oc.env:EVOWORLD_RUN_DIR}/sft
    project_name: evoworld
    experiment_name: milk-bin-pi05-sft
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 3000
data:
  train_data_paths: ${oc.env:EVOWORLD_TRAIN_DATA}
  num_workers: 4
actor:
  group_name: MilkBinSFT
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 4
  seed: 610
  model:
    precision: fp32
    model_type: openpi
    model_path: ${oc.env:EVOWORLD_BASE_MODEL}
    num_action_chunks: 20
    action_dim: 7
    num_steps: 10
    add_value_head: false
    openpi_data:
      norm_stats_path: ${oc.env:EVOWORLD_TRAIN_DATA}/norm_stats.json
    openpi:
      task: sft
      config_name: pi05_evoworld_milk_bin
      embed_dtype: bf16
      num_images_in_input: 2
      action_horizon: 20
      discrete_state_input: true
      torch_compile: false
  optim:
    min_lr_rate: 0.1
    lr: 1e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 20000
    lr_warmup_steps: 1000
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 1e-5
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: true
    wrappers:
      frozen_vlm_experts:
        module_names: ["llm.layers.*.mlps.0", "llm.layers.*.attn.q_proj.0", "llm.layers.*.attn.k_proj.0", "llm.layers.*.attn.v_proj.0", "llm.layers.*.attn.o_proj.0"]
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
