# Native RLinf DSRL smoke only: diagnostic SFT checkpoint, no performance claim.
defaults:
- env/isaaclab_stack_cube@env.train
- env/isaaclab_stack_cube@env.eval
- model/pi0_5@actor.model
- hybrid_engines/openpi_fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
  - file://${oc.env:EVOWORLD_RLINF}/examples/sft/config
cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:EVOWORLD_RUN_DIR}/dsrl-smoke
    project_name: evoworld
    experiment_name: native-dsrl-smoke
    logger_backends:
    - tensorboard
  max_epochs: 2
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 32
    sample_window_size: 32
    min_buffer_size: 1
    auto_save: false
    prefetch_size: 1
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: MilkBinDSRLEnv
  enable_offload: false
  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: false
    use_rel_reward: false
    ignore_terminations: false
    max_episode_steps: 40
    max_steps_per_rollout_epoch: 40
    seed: 41000
    group_size: 1
    init_params:
      id: EvoWorld-Milk-Bin-Franka-v0
      num_envs: 1
      task_description: Pick up the oat milk carton and place it inside the blue storage
        box.
      output_dir: ${oc.env:EVOWORLD_RUN_DIR}/dsrl-smoke/sim-train
    video_cfg:
      save_video: false
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: false
    use_rel_reward: false
    ignore_terminations: false
    max_episode_steps: 40
    max_steps_per_rollout_epoch: 40
    seed: 42000
    group_size: 1
    init_params:
      id: EvoWorld-Milk-Bin-Franka-v0
      num_envs: 1
      task_description: Pick up the oat milk carton and place it inside the blue storage
        box.
      output_dir: ${oc.env:EVOWORLD_RUN_DIR}/dsrl-smoke/sim-eval
    video_cfg:
      save_video: false
rollout:
  group_name: MilkBinDSRLRollout
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: ${oc.env:EVOWORLD_CHECKPOINT}
    precision: ${actor.model.precision}
actor:
  group_name: MilkBinDSRLActor
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 4
  seed: 41000
  enable_offload: false
  model:
    model_path: ${oc.env:EVOWORLD_CHECKPOINT}
    num_action_chunks: 5
    num_steps: 10
    add_value_head: false
    add_q_head: true
    q_head_type: default
    openpi:
      task: dsrl
      use_dsrl: true
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      train_expert_only: true
      detach_critic_input: true
      noise_method: reinflow
      config_name: pi05_evoworld_milk_bin
      action_horizon: 20
      discrete_state_input: true
      torch_compile: false
    precision: bf16
    openpi_data:
      norm_stats_path: ${oc.env:EVOWORLD_TRAIN_DATA}/norm_stats.json
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
  critic_optim:
    lr: 0.0003
    clip_grad: 10.0
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
reward:
  use_reward_model: false
critic:
  use_critic_model: false
