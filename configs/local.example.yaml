# 相对路径基于本文件；切勿提交机器私有的 configs/local.yaml。
storage_root: ../storage
credentials_file: ~/.config/evoworld/credentials.env
environments:
  gpt: ../envs/g1-realtosim/bin/python
  expert: ../envs/sage-robot/bin/python
  rlinf: ../envs/rlinf-py312/bin/python
  sim: ../envs/isaacsim6/bin/python
  convert: ../envs/rlinf-py312/bin/python
upstreams:
  RLinf: ../third_party/RLinf
  sage: ../upstream/sage
  g1-realtosim: ../upstream/g1-realtosim
  IsaacLab-RLinf: ../upstream/IsaacLab-RLinf
  nvdiffrast: ../upstream/nvdiffrast # 专家 CUDA 扩展构建必需；版本见上游清单。
resources: {} # Exact task resource paths; see docs/RESOURCES.md.
network:
  hf_endpoint: https://hf-mirror.com
  pip_index_url: https://pypi.tuna.tsinghua.edu.cn/simple
  gpt_base_url: https://api.openai.com/v1
  gpt_proxy: null
# 仿真入口可选；使用 build_expert_extensions.py 共享 Isaac 库时必须显式填写：
# isaac_experience: /path/to/isaacsim/apps/isaacsim.exp.base.python.kit
# Observation definitions are experiment identity, not camera preference overrides.
observation_contract: milk-bin-side70-v1
resource_checks: {}
# Each training dataset/checkpoint must declare its observation_contract under
# resource_checks; add sha256 mappings for model/resource integrity verification.

# 独立 RL 研究；路径相对本配置文件。无需复制现有环境及权重。
research:
  output_root: ../research/rl/outputs
